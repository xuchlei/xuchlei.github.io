<body>
	<div class="normal">

		<select style="color:red;font-size:11px;border:1px solid #ccc;border-radius:3px;padding:1px 3px !important;background:#fff !important;cursor:pointer;display:inline-block !important;vertical-align:middle;width:auto !important;-webkit-appearance:auto !important;appearance:auto !important;line-height:normal !important;height:auto !important;" id="year" name="year" onchange="getCurrentYearPoint();">
			<option value selected>全部</option>
		</select>
	</div>
	<div id="container"></div>
<script type="text/javascript">
var map = new BMapGL.Map("container", {enableMapClick: false}); // enableMapClick: false禁用点击弹出详细信息窗口
var point = new BMapGL.Point(123.678995,33.632182);
map.centerAndZoom(point, 5);
map.enableScrollWheelZoom(true);     //开启鼠标滚轮缩放
map.setMapType(BMAP_EARTH_MAP);      // 设置地图类型为地球模式

// ===== 行政区边界：直接读取 areas_boundary.js（GCJ-02 坐标），转换到百度 BD-09 =====
var AREA_X_PI = Math.PI * 3000.0 / 180.0;
function gcj02ToBd09(lng, lat) {
    var x = lng, y = lat;
    var z = Math.sqrt(x * x + y * y) + 0.00002 * Math.sin(y * AREA_X_PI);
    var theta = Math.atan2(y, x) + 0.000003 * Math.cos(x * AREA_X_PI);
    return [z * Math.cos(theta) + 0.0065, z * Math.sin(theta) + 0.0065];
}
function areaCityKey(adcode) {
    var s = String(adcode);
    if (s.indexOf('3706') === 0) return 'yantai';
    if (s.indexOf('3701') === 0) return 'jinan';
    if (s.indexOf('3301') === 0) return 'hangzhou';
    if (s.indexOf('31') === 0)   return 'shanghai';
    return 'other';
}
var AREA_STYLE = {
    yantai:   { color: '#1e88e5' }, // 烟台 蓝
    jinan:    { color: '#43a047' }, // 济南 绿
    hangzhou: { color: '#e53935' }, // 杭州 红
    shanghai: { color: '#fb8c00' }, // 上海 橙
    other:    { color: '#888888' }
};
var areaPolys = [];
function drawAreas() {
    areaPolys = [];
    if (typeof AREA_BOUNDARIES === 'undefined' || !AREA_BOUNDARIES || !AREA_BOUNDARIES.features) return;
    AREA_BOUNDARIES.features.forEach(function (f) {
        var props = f.properties || {};
        var style = AREA_STYLE[areaCityKey(props.adcode)] || AREA_STYLE.other;
        var g = f.geometry;
        if (!g) return;
        // 取每个多边形的「外环」绘制（百度 Polygon 不支持孔洞，画外环即可正确铺陆地）
        var rings = [];
        if (g.type === 'Polygon') rings.push(g.coordinates[0]);
        else if (g.type === 'MultiPolygon') g.coordinates.forEach(function (poly) { rings.push(poly[0]); });
		rings.forEach(function (ring) {
			var bdRing = ring.map(function (c) {
				return gcj02ToBd09(c[0], c[1]); // GCJ-02 -> BD-09
			});
			var pts = bdRing.map(function (b) {
				return new BMapGL.Point(b[0], b[1]);
			});
			if (!pts.length) return;
			var ply = new BMapGL.Polygon(pts, {
				strokeWeight: 2, strokeColor: style.color,
				fillColor: style.color, fillOpacity: 0.2
			});
			areaPolys.push(ply);
			map.addOverlay(ply);
		});
	});
}
function addAreaOverlays() { areaPolys.forEach(function (p) { map.addOverlay(p); }); }
drawAreas();

var markerList = []; // 记录已添加的足迹标记，供年份筛选时仅移除标记（区域边界保持不动）

function addMarker(point){
	var curpoint = new BMapGL.Point(point.lng, point.lat);
	var myIcon = new BMapGL.Icon("img/map/marker_blue.png", new BMapGL.Size(23, 25), {anchor: new BMapGL.Size(8, 25)}); // 自定义标记图片，设置anchor使图片位置和默认标记位置一致
	var marker = new BMapGL.Marker(curpoint); // 自定义标记图片，直接使用参数{icon: myIcon}会丢失自动添加的阴影
	map.addOverlay(marker);
	markerList.push(marker); // 登记标记，供年份筛选时仅移除标记（区域边界保持不动）
	if (point.title !== "") {
		var opts = {
			width : 300,     // 信息窗口宽度
			height: 130,     // 信息窗口高度
			title : point.title,
			offset: new BMapGL.Size(0, -25) // 自定义标记图片，设置offset使信息窗口位置和默认信息窗口位置一致
		}
		var contentLen = point.content.length;
		point.content = "<span style='text-indent:2em;line-height:normal;'>" + point.content + "</span>";
		// 有图片时，调整内容
		if (point.img && point.img !== "") {
			// 内容过多时，调整字体大小
			var reFontSize = "";
			if (34 < contentLen) {
				reFontSize = "font-size:12px;"
			}
			point.content = point.content.replace("text-indent:2em", reFontSize + "text-indent:2em;float:left;width:120px;") + "<img style='float:right;' src='" + point.img + "' width='150' height='100' />"
		}
		marker.setIcon(myIcon); // 自定义标记图片，使用marker.setIcon()会自动添加阴影
		var infoWindow = new BMapGL.InfoWindow(point.content, opts); // 创建信息窗口对象
		marker.addEventListener("click", function(){
			this.openInfoWindow(infoWindow);
			// 移动显示
			map.panTo(point);
			// if (map.getZoom() < 12) {
			// 	map.setZoom(12);
			// }
		});
	}
}

// 根据点数组手动计算 bounds 并精确 fit（百度GL setViewport 在切换年份时只平移不缩放，导致边缘点被切，故手动算 zoom+center）
function fitBoundsGL(pts) {
  if (!pts || !pts.length) return;
  var minLng = 180, maxLng = -180, minLat = 90, maxLat = -90;
  for (var i = 0; i < pts.length; i++) {
    var lng = pts[i].lng, lat = pts[i].lat;
    if (lng < minLng) minLng = lng;
    if (lng > maxLng) maxLng = lng;
    if (lat < minLat) minLat = lat;
    if (lat > maxLat) maxLat = lat;
  }
  var center = new BMapGL.Point((minLng + maxLng) / 2, (minLat + maxLat) / 2);
  var size = map.getSize();
  var w = size.width * 0.85, h = size.height * 0.85; // 只用 85% 视野，留边距
  if (maxLng - minLng < 1e-7 && maxLat - minLat < 1e-7) {
    map.centerAndZoom(center, 13);
    return;
  }
  var PI = Math.PI;
  var dxFrac = (maxLng - minLng) / 360;
  var zLng = Math.log(w / (256 * dxFrac)) / Math.LN2;
  var yTop = 0.5 - Math.log((1 + Math.sin(maxLat * PI / 180)) / (1 - Math.sin(maxLat * PI / 180))) / (4 * PI);
  var yBot = 0.5 - Math.log((1 + Math.sin(minLat * PI / 180)) / (1 - Math.sin(minLat * PI / 180))) / (4 * PI);
  var dyFrac = Math.abs(yTop - yBot);
  var zLat = Math.log(h / (256 * dyFrac)) / Math.LN2;
  var z = Math.min(zLng, zLat);
  z = Math.floor(z); // 取整更保守，保证全部点可见
  if (z < 3) z = 3;
  if (z > 19) z = 19;
  map.centerAndZoom(center, z);
}

for (var i = 0; i < points.length; i++) {
	addMarker(points[i]);
}
// 初始：根据所有足迹点自动调整显示范围（替代固定的 centerAndZoom）
fitBoundsGL(points);

// 年度功能
document.addEventListener('DOMContentLoaded', function() {
	var yearList = new Set([]);
	var yearFirstDropdown = document.getElementById('year');

	var yearList = new Set([]);
	for (var i = 0; i < points.length; i++) {
		if (points[i].date) {
			yearList.add(points[i].date.slice(0, 4))
		}
	}

	var optionAry = [...yearList].sort().reverse();

	optionAry.forEach(item => {
		var option = document.createElement('option');
		option.value = item;
		option.textContent = item;
		yearFirstDropdown.appendChild(option);
	});
});

function getCurrentYearPoint() {
	var year = document.getElementsByName('year')[0].value;
	// 仅移除已添加的足迹标记，区域边界 Polygon 保持不动，避免重画区域
	for (var i = 0; i < markerList.length; i++) {
		map.removeOverlay(markerList[i]);
	}
	markerList = [];
	var curPts = [];
	for (var i = 0; i < points.length; i++) {
		if (points[i].date && (year === '' || points[i].date.slice(0, 4) === year)) {
			addMarker2(points[i]);
			curPts.push(new BMapGL.Point(points[i].lng, points[i].lat));
		}
	}
	// 年份筛选后：根据当前可见的足迹点自动调整显示范围（手动算 bounds，避免 setViewport 只平移不缩放）
	fitBoundsGL(curPts);
}

function addMarker2(point){
	var curpoint = new BMapGL.Point(point.lng, point.lat);
	var myIcon = new BMapGL.Icon("img/map/marker_blue.png", new BMapGL.Size(23, 25), {anchor: new BMapGL.Size(8, 25)}); // 自定义标记图片，设置anchor使图片位置和默认标记位置一致
	var marker = new BMapGL.Marker(curpoint); // 自定义标记图片，直接使用参数{icon: myIcon}会丢失自动添加的阴影
	map.addOverlay(marker);
	markerList.push(marker); // 登记标记，供年份筛选时仅移除标记（区域边界保持不动）
	if (point.title !== "") {
		var opts = {
			width : 300,     // 信息窗口宽度
			height: 130,     // 信息窗口高度
			title : point.title,
			offset: new BMapGL.Size(0, -25) // 自定义标记图片，设置offset使信息窗口位置和默认信息窗口位置一致
		}
		marker.setIcon(myIcon); // 自定义标记图片，使用marker.setIcon()会自动添加阴影
		var infoWindow = new BMapGL.InfoWindow(point.content, opts); // 创建信息窗口对象
		marker.addEventListener("click", function(){
			this.openInfoWindow(infoWindow);
			// 移动显示
			map.panTo(point);
			// if (map.getZoom() < 12) {
			// 	map.setZoom(12);
			// }
		});
	}
}
