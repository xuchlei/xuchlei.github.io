<!DOCTYPE html>
<html>
<head><meta name="generator" content="Hexo 3.9.0">
<meta name="viewport" content="initial-scale=1.0, user-scalable=no">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>我的足迹</title>
<style type="text/css">
html{height:100%}
body{height:100%;margin:0px;padding:0px}
#container{height:100%}
.normal {position:absolute;top:10px;right:10px;z-index:1000;background:#00adff;opacity:0.8;padding:2px 5px;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.25);font-size:11px;display:inline-block;white-space:nowrap;color:red;}
</style>
<script type="text/javascript" src="https://api.map.baidu.com/api?v=3.0&ak=AA4uqECjDYfZUk9vSVMNR5bPdFEtw6GU">
//v3.0版本的引用方式：src="http://api.map.baidu.com/api?v=3.0&ak=您的密钥"
</script>
<script type="text/javascript" src="data.js"></script>
<script type="text/javascript" src="areas_boundary.js"></script>
</head>

<body>
	<div class="normal">
		年度
		<select style="color:red;font-size:11px;border:1px solid #ccc;border-radius:3px;padding:1px 3px !important;background:#fff !important;cursor:pointer;display:inline-block !important;vertical-align:middle;width:auto !important;-webkit-appearance:auto !important;appearance:auto !important;line-height:normal !important;height:auto !important;" id="year" name="year" onchange="getCurrentYearPoint();">
			<option value selected>全部</option>
		</select>
	</div>
<div id="container"></div>
<script type="text/javascript">
var map = new BMap.Map("container", {enableMapClick: false}); // enableMapClick: false禁用点击弹出详细信息窗口
var point = new BMap.Point(123.678995,33.632182);
map.centerAndZoom(point, 5);
map.enableScrollWheelZoom(true);     //开启鼠标滚轮缩放

// ===== 行政区边界：直接读取 areas_boundary.js（GCJ-02 坐标），转换到百度 BD-09 =====
var AREA_X_PI = Math.PI * 3000.0 / 180.0;
function gcj02ToBd09(lng, lat) {
    var x = lng, y = lat;
    var z = Math.sqrt(x * x + y * y) + 0.00002 * Math.sin(y * AREA_X_PI);
    var theta = Math.atan2(y, x) + 0.000003 * Math.cos(x * AREA_X_PI);
    return [z * Math.cos(theta) + 0.0065, z * Math.sin(theta) + 0.0065];
}
function areaCityKey(adcode) {
    var s = String(adcode);
    if (s.indexOf('3706') === 0) return 'yantai';
    if (s.indexOf('3701') === 0) return 'jinan';
    if (s.indexOf('3301') === 0) return 'hangzhou';
    if (s.indexOf('31') === 0)   return 'shanghai';
    return 'other';
}
var AREA_STYLE = {
    yantai:   { color: '#1e88e5' }, // 烟台 蓝
    jinan:    { color: '#43a047' }, // 济南 绿
    hangzhou: { color: '#e53935' }, // 杭州 红
    shanghai: { color: '#fb8c00' }, // 上海 橙
    other:    { color: '#888888' }
};
function drawAreas() {
    if (typeof AREA_BOUNDARIES === 'undefined' || !AREA_BOUNDARIES || !AREA_BOUNDARIES.features) return;
    AREA_BOUNDARIES.features.forEach(function (f) {
        var props = f.properties || {};
        var style = AREA_STYLE[areaCityKey(props.adcode)] || AREA_STYLE.other;
        var g = f.geometry;
        if (!g) return;
        // 取每个多边形的「外环」绘制（百度 Polygon 不支持孔洞，画外环即可正确铺陆地）
        var rings = [];
        if (g.type === 'Polygon') rings.push(g.coordinates[0]);
        else if (g.type === 'MultiPolygon') g.coordinates.forEach(function (poly) { rings.push(poly[0]); });
        rings.forEach(function (ring) {
            var pts = ring.map(function (c) {
                var bd = gcj02ToBd09(c[0], c[1]); // GCJ-02 -> BD-09
                return new BMap.Point(bd[0], bd[1]);
            });
            if (!pts.length) return;
            var ply = new BMap.Polygon(pts, {
                strokeWeight: 2, strokeColor: style.color,
                fillColor: style.color, fillOpacity: 0.2
            });
            map.addOverlay(ply);
        });
    });
}
drawAreas();
var markerList = []; // 记录已添加的足迹标记，供年份筛选时仅移除标记（区域边界保持不动）
var iw = new BMap.InfoWindow("<span style='float:left;width:40%;font-size:10px;'>有一个夜晚我烧毁了所有的记忆，从此我的梦就透明了；<br/>有一个早晨我扔掉了所有的昨天，从此我的脚步就轻盈了。</span><img style='float:right;' src='img/map/index.jpg' width='150' height='100' />", {width : 335, height: 150, title: "　"}); // 创建信息窗口对象
map.openInfoWindow(iw, point); //开启信息窗口

function addMarker(point){
	var curpoint = new BMap.Point(point.lng, point.lat);
	var myIcon = new BMap.Icon("img/map/marker_blue_sprite.png", new BMap.Size(19, 25), {anchor: new BMap.Size(8, 25)}); // 自定义标记图片，设置anchor使图片位置和默认标记位置一致
	var marker = new BMap.Marker(curpoint); // 自定义标记图片，直接使用参数{icon: myIcon}会丢失自动添加的阴影
	map.addOverlay(marker);
	markerList.push(marker); // 登记标记，供年份筛选时仅移除标记（区域边界保持不动）
	if (point.title !== "") {
		var opts = {
			width : 300,     // 信息窗口宽度
			height: 130,     // 信息窗口高度
			title : point.title,
			offset: new BMap.Size(0, -25) // 自定义标记图片，设置offset使信息窗口位置和默认信息窗口位置一致
		}
		var contentLen = point.content.length;
		point.content = "<span style='text-indent:2em'>" + point.content + "</span>";
		// 有图片时，调整内容
		if (point.img && point.img !== "") {
			// 内容过多时，调整字体大小
			var reFontSize = "";
			if (34 < contentLen) {
				reFontSize = "font-size:12px;";
			}
			point.content = point.content.replace("text-indent:2em", reFontSize + "text-indent:2em;float:left;width:48%;") + "<img style='float:right;' src='" + point.img + "' width='150' height='100' />"
		}
		marker.setIcon(myIcon); // 自定义标记图片，使用marker.setIcon()会自动添加阴影
		var infoWindow = new BMap.InfoWindow(point.content, opts); // 创建信息窗口对象
		marker.addEventListener("click", function(){
			this.openInfoWindow(infoWindow);
			// 移动显示
			map.panTo(point);
			if (map.getZoom() < 12) {
				map.setZoom(12);
			}
		});
	}
}

for (var i = 0; i < points.length; i++) {
	addMarker(points[i]);
}
// 初始：根据所有足迹点自动调整显示范围（替代固定的 centerAndZoom）
map.setViewport(points.map(function(p){ return new BMap.Point(p.lng, p.lat); }));

// 年度功能
document.addEventListener('DOMContentLoaded', function() {
	var yearList = new Set([]);
	for (var i = 0; i < points.length; i++) {
		if (points[i].date) {
			yearList.add(points[i].date.slice(0, 4))
		}
	}
	var optionAry = [...yearList].sort().reverse();
	var yearFirstDropdown = document.getElementById('year');
	optionAry.forEach(item => {
		var option = document.createElement('option');
		option.value = item;
		option.textContent = item;
		yearFirstDropdown.appendChild(option);
	});
});

function getCurrentYearPoint() {
	var year = document.getElementsByName('year')[0].value;
	// 仅移除已添加的足迹标记，区域边界 Polygon 保持不动，避免重画区域
	for (var i = 0; i < markerList.length; i++) {
		map.removeOverlay(markerList[i]);
	}
	markerList = [];
	var curPts = [];
	for (var i = 0; i < points.length; i++) {
		if (points[i].date && (year === '' || points[i].date.slice(0, 4) === year)) {
			addMarker2(points[i]);
			curPts.push(new BMap.Point(points[i].lng, points[i].lat));
		}
	}
	// 年份筛选后：根据当前可见的足迹点自动调整显示范围
	if (curPts.length) map.setViewport(curPts);
}

function addMarker2(point){
	var curpoint = new BMap.Point(point.lng, point.lat);
	var myIcon = new BMap.Icon("img/map/marker_blue_sprite.png", new BMap.Size(19, 25), {anchor: new BMap.Size(8, 25)});
	var marker = new BMap.Marker(curpoint);
	map.addOverlay(marker);
	markerList.push(marker); // 登记标记，供年份筛选时仅移除标记（区域边界保持不动）
	if (point.title !== "") {
		var opts = {
			width : 300,
			height: 130,
			title : point.title,
			offset: new BMap.Size(0, -25)
		}
		marker.setIcon(myIcon); // 自定义标记图片，使用marker.setIcon()会自动添加阴影
		var infoWindow = new BMap.InfoWindow(point.content, opts); // 创建信息窗口对象
		marker.addEventListener("click", function(){
			this.openInfoWindow(infoWindow);
			map.panTo(point);
			if (map.getZoom() < 12) {
				map.setZoom(12);
			}
		});
	}
}
</script>
</body>
</html>
