<!doctype html>
<html>
<head><meta name="generator" content="Hexo 3.9.0">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no, width=device-width">
    <link rel="stylesheet" href="https://a.amap.com/jsapi_demos/static/demo-center/css/demo-center.css">
    <title>我的足迹</title>
    <style>
        html,
        body,
        #container {
          width: 100%;
          height: 100%;
        }
		.amap-icon img{
            width: 25px;
            height: 34px;
        }
        .normal {position:absolute;top:10px;right:10px;z-index:1000;background:#00adff;opacity:0.8;padding:2px 5px;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.25);font-size:11px;display:inline-block;white-space:nowrap;color:red;}
    </style>
</head>
<body>
	<div class="normal">
		年度
		<select style="color:red;font-size:11px;border:1px solid #ccc;border-radius:3px;padding:1px 3px !important;background:#fff !important;cursor:pointer;display:inline-block !important;vertical-align:middle;width:auto !important;-webkit-appearance:auto !important;appearance:auto !important;line-height:normal !important;height:auto !important;" id="year" name="year" onchange="getCurrentYearPoint();">
			<option value selected>全部</option>
		</select>
	</div>
	<div id="container"></div>
<!-- 加载地图JSAPI脚本 -->
<script type="text/javascript" src="https://webapi.amap.com/maps?v=1.4.4&key=ab90646a4f5e056555ba2e086181d327&plugin=AMap.Geocoder"></script>
<script type="text/javascript" src="https://webapi.amap.com/maps?v=1.4.15&key=ab90646a4f5e056555ba2e086181d327&plugin=AMap.DistrictSearch"></script>
<script type="text/javascript" src="data.js"></script>
<script type="text/javascript" src="areas_boundary.js"></script>
<script>
var map = new AMap.Map('container');

// ===== 行政区边界：直接读取 areas_boundary.js（GCJ-02，与高德底图同源，无需坐标转换）=====
var areaPolys = [];
function areaCityKey(adcode) {
	var s = String(adcode);
	if (s.indexOf('3706') === 0) return 'yantai';
	if (s.indexOf('3701') === 0) return 'jinan';
	if (s.indexOf('3301') === 0) return 'hangzhou';
	if (s.indexOf('31') === 0)   return 'shanghai';
	return 'other';
}
var AREA_STYLE = {
	yantai:   { color: '#1e88e5' }, // 烟台 蓝
	jinan:    { color: '#43a047' }, // 济南 绿
	hangzhou: { color: '#e53935' }, // 杭州 红
	shanghai: { color: '#fb8c00' }, // 上海 橙
	other:    { color: '#888888' }
};
function drawAreas() {
	areaPolys = [];
	if (typeof AREA_BOUNDARIES === 'undefined' || !AREA_BOUNDARIES || !AREA_BOUNDARIES.features) return;
	AREA_BOUNDARIES.features.forEach(function (f) {
		var props = f.properties || {};
		var style = AREA_STYLE[areaCityKey(props.adcode)] || AREA_STYLE.other;
		var g = f.geometry;
		if (!g) return;
		// 每个多边形 rings = [[外环], [洞1], [洞2]...]，多维数组作为 AMap 带洞 path
		var polys = [];
		if (g.type === 'Polygon') polys.push(g.coordinates);
		else if (g.type === 'MultiPolygon') g.coordinates.forEach(function (poly) { polys.push(poly); });
		polys.forEach(function (rings) {
			var path = rings.map(function (ring) {
				return ring.map(function (c) { return [c[0], c[1]]; }); // GCJ-02 经纬度
			});
			var polygon = new AMap.Polygon({
				strokeWeight: 2,
				path: path,
				fillOpacity: 0.2,
				fillColor: style.color,
				strokeColor: style.color
			});
			areaPolys.push(polygon);
			map.add(polygon);
		});
	});
}
drawAreas();

// 标记点
points.forEach(function(marker) {
	// 百度转高德（百度坐标bd09–>火星坐标gcj02）
	var PI = Math.PI * 3000.0 / 180.0;
	var x = marker.lng - 0.0065;
	var y = marker.lat - 0.006;
	var z = Math.sqrt(x * x + y * y) - 0.00002 * Math.sin(y * PI);
	var theta = Math.atan2(y, x) - 0.000003 * Math.cos(x * PI);
	var mk = new AMap.Marker({
	  map: map,
	  position: [z * Math.cos(theta), z * Math.sin(theta)],
	  icon: 'https://a.amap.com/jsapi_demos/static/demo-center/icons/poi-marker-red.png'  // 默认无内容→红
	});
	if (marker.title !== "") {
		mk.setIcon();

		var contentLen = marker.content.length;
		marker.content = "<h4>" + marker.title + "</h4><span style='text-indent:2em'>" + marker.content + "</span>";
		// 有图片时，调整内容
		if (marker.img && marker.img !== "") {
			// 内容过多时，调整字体大小
			var reFontSize = "";
			if (34 < contentLen) {
				reFontSize = "font-size:12px;"
			}
			marker.content = marker.content.replace("text-indent:2em", reFontSize + "text-indent:2em;float:left;width:48%;") + "<img style='float:right;' src='" + marker.img + "' width='150' height='100' />"
		}

		var infoWindow = new AMap.InfoWindow({
			content: marker.content,  //使用默认信息窗体框样式，显示信息内容
			offset: new AMap.Pixel(4, -34)
		});
		//鼠标点击marker弹出自定义的信息窗体
		AMap.event.addListener(mk, 'click', function () {
			infoWindow.open(map, mk.getPosition());
		});
	}
});

// 根据地图上添加的覆盖物分布情况，自动缩放地图到合适的视野级别，参数均可缺省
// 初始：根据所有足迹点自动调整显示范围（只 fit marker，不把区域边界 Polygon 算进来）
map.setFitView(map.getAllOverlays('marker'));

var iw = new AMap.InfoWindow({
	content: "<br/><span style='float:left;width:40%;font-size:10px;'>有一个夜晚我烧毁了所有的记忆，从此我的梦就透明了；<br/>有一个早晨我扔掉了所有的昨天，从此我的脚步就轻盈了。</span><img style='float:right;' src='img/map/index.jpg' width='150' height='100' />"  //使用默认信息窗体框样式，显示信息内容
});
iw.open(map, map.getCenter());

// 年度功能
document.addEventListener('DOMContentLoaded', function() {
	var yearList = new Set([]);
	var yearFirstDropdown = document.getElementById('year');

	var yearList = new Set([]);
	for (var i = 0; i < points.length; i++) {
		if (points[i].date) {
			yearList.add(points[i].date.slice(0, 4))
		}
	}

	var optionAry = [...yearList].sort().reverse();

	optionAry.forEach(item => {
		var option = document.createElement('option');
		option.value = item;
		option.textContent = item;
		yearFirstDropdown.appendChild(option);
	});
});

function getCurrentYearPoint() {
	var year = document.getElementsByName('year')[0].value;
	// 仅移除已添加的足迹标记（getAllOverlays('marker')），区域边界 Polygon 保持不动，避免重画区域
	map.remove(map.getAllOverlays('marker'));
	for (var i = 0; i < points.length; i++) {
		if (points[i].date && (year === '' || points[i].date.slice(0, 4) === year)) {
			addMarker2(points[i]);
		}
	}
	// 年份筛选后：根据当前可见的足迹点自动调整显示范围（只 fit marker，不把区域边界算进来）
	map.setFitView(map.getAllOverlays('marker'));
}

function addMarker2(marker){
	// 百度转高德（百度坐标bd09–>火星坐标gcj02）
	var PI = Math.PI * 3000.0 / 180.0;
	var x = marker.lng - 0.0065;
	var y = marker.lat - 0.006;
	var z = Math.sqrt(x * x + y * y) - 0.00002 * Math.sin(y * PI);
	var theta = Math.atan2(y, x) - 0.000003 * Math.cos(x * PI);
	var mk = new AMap.Marker({
	  map: map,
	  position: [z * Math.cos(theta), z * Math.sin(theta)],
	  icon: 'https://a.amap.com/jsapi_demos/static/demo-center/icons/poi-marker-red.png'  // 默认无内容→红
	});
	if (marker.title !== "") {
		mk.setIcon();
		var infoWindow = new AMap.InfoWindow({
			content: marker.content,  //使用默认信息窗体框样式，显示信息内容
			offset: new AMap.Pixel(4, -34)
		});
		//鼠标点击marker弹出自定义的信息窗体
		AMap.event.addListener(mk, 'click', function () {
			infoWindow.open(map, mk.getPosition());
		});
	}
}
</script>
</body>
</html>
